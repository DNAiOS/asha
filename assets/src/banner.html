<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "Montserrat"; src: url("file:///Library/Fonts/Montserrat-VariableFont_wght.ttf"); }
  html, body { margin: 0; }
  body { width: 1280px; height: 400px; background: #f4efe6; color: #2a2420; font-family: "Montserrat", sans-serif;
         display: grid; grid-template-columns: 489px 1fr; align-items: center; overflow: hidden; }
  .mark { display: flex; justify-content: center; align-items: center; height: 400px; border-right: 1px solid #d9d0c3; }
  .mark img { width: 216px; height: 216px; border-radius: 36px; }
  .copy { padding: 0 72px 0 64px; }
  h1 { font-family: "Iowan Old Style", Georgia, serif; font-weight: 700; font-size: 96px; line-height: 1.0; margin: 0 0 16px; letter-spacing: -1px; }
  p { font-size: 26px; line-height: 1.4; margin: 0 0 32px; color: #2a2420; text-wrap: balance; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .chip { font-size: 16px; font-weight: 600; color: #067078; border: 1.5px solid #067078; border-radius: 999px; padding: 6px 16px; }
  .host { margin-top: 24px; font-size: 16px; color: #6b5f54; letter-spacing: 0.2px; }
</style></head>
<body>
  <div class="mark"><img src="../brand/asha-avatar.png" alt=""></div>
  <div class="copy">
    <h1>Asha API</h1>
    <p>Medical answers with their sources, inside your product.</p>
    <div class="row">
      <span class="chip">OpenAI-compatible /v1</span>
      <span class="chip">A2A v1.0</span>
      <span class="chip">MCP server</span>
      <span class="chip">CLI</span>
    </div>
    <div class="host">api.askasha.org · DNAi Systems</div>
  </div>
</body></html>
