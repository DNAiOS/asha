name: verify against the live API

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Register hash, health, OpenAPI drift
        run: python3 scripts/verify.py
      - name: Examples compile
        run: python3 -m py_compile examples/python/*.py examples/langchain/*.py examples/litellm/*.py huggingface/space/app.py
